<!-- Light or Dark, as this device chose on the dashboard (its sun/moon button), before the first paint; it follows a change made there. -->
<script>(function(){function apply(){try{if(localStorage.getItem('cestisTheme')==='light')document.documentElement.setAttribute('data-theme','light');else document.documentElement.removeAttribute('data-theme');}catch(e){}}apply();try{window.addEventListener('storage',function(e){if(e.key==='cestisTheme')apply();});}catch(e){}})();</script>
<!-- One look with the LMS dashboard (outer chrome only; see the file). Last, so it wins. -->

<div class="app-ui">

      <span data-cestis-sync-chip></span>

    </div>

    <h2>Purchase Order Details</h2>

<script src="finance-logos.js?v=20260713b"></script>
<script src="finance-docs.js?v=20261028d"></script>
<script>
/* Who may open this page. It had no sign-in and showed the Centre's books to
   whoever typed its address — a trainee at a lab PC included. It opens only
   for the signed-in dashboard (an Administrator or Admin Staff: embedded, or
   signed in on this computer — CESTISCore.sessionAccess.guard); anyone
   else sees "sign in first" and nothing of the page runs. */
(function () {
  var SA = window.CESTISCore && CESTISCore.sessionAccess;
  if (!SA || !SA.guard) { document.body.textContent = 'Shared data core failed to load. Please refresh.'; return; }
  SA.guard({ allowed: ['admin', 'adminstaff'] }, function (viewer) {
    if (!viewer.ok) { SA.lockPage(viewer.message); return; }
    FinanceDoc.init({
      docType: 'po',
      storageKey: 'cestis_finance_pos',
      numberSeed: 1001,
      dueDays: 14,
      hasTemplates: false,
      hasStatus: true,
      canConvert: false,
      labels: { title: 'PURCHASE ORDER', docWord: 'purchase order', noLabel: 'PO NO', dateLabel: 'PO DATE', dueLabel: 'DELIVERY DATE' }
    });
  });
})();
</script>

<!-- Per-page Google Drive save path (own file in the shared backup folder) -->
<script src="cestis-page-cloud.js?v=20261030d"></script>
<script src="cestis-sync-chip.js?v=20261028d"></script>
<script>
CESTISPageCloud.init({
  page: 'Purchase Order',
  file: 'CESTIS_Finance_PurchaseOrders.json',
  keys: ['cestis_finance_pos', 'cestis_finance_convert', 'cestis_finance_pos_deleted'],
  // A pull lands in storage while the page holds its list in memory; fold it
  // in, or the next save writes the stale list back over it.
  onRestore: function () { try { if (window.FinanceDoc && FinanceDoc.reload) FinanceDoc.reload(); } catch (e) {} }
});
</script>
