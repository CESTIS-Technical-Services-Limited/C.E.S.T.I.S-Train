<!--
  ============================================================================
  Pages/My-Appraisal.html — "My Appraisal (Staff)" UI fragment
  ----------------------------------------------------------------------------
  Mounted (via the cestis-mount feature system) into FOUR role pages:
    - Administrator  (page-my-appraisal,     prefix "admin")   — signs as Appraiser
    - Instructor     (page-i-my-appraisal,   prefix "i")       — signs as Appraisee
    - Admin Staff    (page-as-my-appraisal,  prefix "as")      — signs as Appraisee
    - CMC            (page-cmc-my-appraisal, prefix "cmc")     — signs as CMC Chair
  __PREFIX__ is substituted at mount time so ids stay unique per role page.
  All logic lives in staff-appraisals.js (sappMyApprOnShow) because
  innerHTML-injected fragments cannot run <script>.
  Staff see their COMPLETED appraisal instrument (the exact-replica PDF) here
  and sign it: type a name, draw a signature, or upload a signature PNG.
  ============================================================================
-->
<style>
  .sapp-sign-tabs { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .sapp-sign-tab {
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 13px;
    background: var(--bg-card-hover, rgba(127,127,127,.12)); border: 1px solid var(--border, #444);
  }
  .sapp-sign-tab.active { background: var(--accent); color: #1a1a1a; font-weight: 700; border-color: var(--accent); }
  .sapp-sign-canvas {
    background: #fff; border: 1px dashed #888; border-radius: 8px; cursor: crosshair;
    touch-action: none; display: block;
  }
  .sapp-sig-preview-typed {
    font-family: 'Segoe Script', 'Brush Script MT', 'Lucida Handwriting', cursive;
    font-size: 24px; color: #111; background: #fff; border-radius: 8px;
    padding: 10px 18px; min-height: 48px; display: flex; align-items: center;
  }
  .sapp-doc-scroll { overflow: auto; background: #6b6f76; border-radius: 10px; padding: 16px; max-height: 68vh; }
</style>

<div id="__PREFIX__SappMyApprRoot" class="sapp-myappr-root" data-prefix="__PREFIX__">
  <div class="card" style="padding:32px;text-align:center;color:var(--text-muted);">Loading appraisals…</div>
</div>
