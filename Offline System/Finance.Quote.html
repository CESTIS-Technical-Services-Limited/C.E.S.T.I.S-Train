<div class="app-ui">
  <div class="fd-header">
    <div>
      <div class="crumbs"><a href="Payments.Invoices.html">← Payments / Invoices</a></div>
      <h1>📋 Quote</h1>
      <div class="sub">Prepare job quotations — set a deposit requirement, then convert an accepted quote straight to an invoice</div>
    </div>
    <div class="fd-actions">
      <span data-cestis-sync-chip></span>

      <button class="btn" onclick="FinanceDoc.printDoc()">🖨 Print / PDF</button>
    </div>
  </div>

  <div class="card">
    <h2>Quote Details</h2>
    <div id="fdEditor"></div>
  </div>

  <div class="card">
    <h2>Saved Quotes</h2>

</div>

<div id="fdToast"></div>

<script src="finance-logos.js?v=20260713b"></script>
<script src="finance-docs.js?v=20261022a"></script>
<script>
/* Who may open this page. It had no sign-in and showed the Centre's books to
   whoever typed its address — a trainee at a lab PC included. It opens only
   for the signed-in dashboard (an Administrator or Admin Staff: embedded, or
   signed in on this computer — CESTISCore.sessionAccess.guard); anyone
   else sees "sign in first" and nothing of the page runs. */
(function () {
  var SA = window.CESTISCore && CESTISCore.sessionAccess;
  if (!SA || !SA.guard) { document.body.textContent = 'Shared data core failed to load. Please refresh.'; return; }
  SA.guard({ allowed: ['admin', 'adminstaff'] }, function (viewer) {
    if (!viewer.ok) { SA.lockPage(viewer.message); return; }
    FinanceDoc.init({
      docType: 'quote',
      storageKey: 'cestis_finance_quotes',
      numberSeed: 1561, /* the office's real quote numbering had reached 1560 */
      dueDays: 15,
      hasTemplates: false,
      hasStatus: false,
      canConvert: true,
      labels: { title: 'QUOTE', docWord: 'quote', noLabel: 'QUOTE NO', dateLabel: 'QUOTE DATE', dueLabel: 'EXPIRATION DATE' }
    });
  });
})();
</script>

<!-- Per-page Google Drive save path (own file in the shared backup folder) -->
<script src="cestis-page-cloud.js?v=20261022a"></script>
<script src="cestis-sync-chip.js?v=20261022b"></script>
<script>
CESTISPageCloud.init({
  page: 'Quotation',
  file: 'CESTIS_Finance_Quotes.json',
  keys: ['cestis_finance_quotes', 'cestis_finance_convert', 'cestis_finance_quotes_deleted'],
  // A pull lands in storage while the page holds its list in memory; fold it
  // in, or the next save writes the stale list back over it.
  onRestore: function () { try { if (window.FinanceDoc && FinanceDoc.reload) FinanceDoc.reload(); } catch (e) {} }
});
</script>
