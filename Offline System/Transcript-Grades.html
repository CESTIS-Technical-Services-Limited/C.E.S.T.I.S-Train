<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="cestis-core.js?v=20261030a"></script>
<script src="transcript-assets.js?v=20260711b"></script>
<script src="vendor/jspdf-2.5.1.umd.min.js"></script>
<script>window.jspdf||(document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">\x3C/script>'))</script>
<script>window.jspdf||(document.write('<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js">\x3C/script>'))</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcript / Grades — C.E.S.T.I.S</title>
<style>
  :root {
    --bg-primary: #0c1117;
    --bg-secondary: #141b24;
    --bg-card: #1a2332;
    --bg-card-hover: #1f2b3d;
    --bg-input: #0f1820;
    --accent: #f0a500;
    --accent-dim: rgba(240,165,0,0.15);
    --green: #2ecc71;
    --green-dim: rgba(46,204,113,0.15);
    --blue: #3498db;
    --blue-dim: rgba(52,152,219,0.15);
    --purple: #9b59b6;
    --red: #e74c3c;
    --red-dim: rgba(231,76,60,0.15);
    --text-primary: #e8edf3;
    --text-secondary: #8899aa;
    --text-muted: #8293a7;   /* 5.0:1 on a card (was #556677, 2.7:1) — as index.html */
    --border: rgba(255,255,255,0.06);
    --border-light: rgba(255,255,255,0.1);
    --radius: 12px;
    --radius-sm: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    padding: 18px;
    -webkit-font-smoothing: antialiased;
  }
  /* The official transcript typeface ('EB Garamond T') is embedded from
     transcript-assets.js by the loader script at the end of this page. */

  .tg-header { display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:16px; }
  .tg-header h1 { font-size:21px; font-weight:700; }
  .tg-header p { font-size:13px; color:var(--text-muted); margin-top:4px; max-width:720px; line-height:1.45; }
  .tg-live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--green); margin-right:6px; animation:tgPulse 1.6s infinite; vertical-align:1px; }
  @keyframes tgPulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  .tg-controls { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .tg-input, .tg-select {
    background: var(--bg-input);
    border: 1px solid var(--border-light);
    color: var(--text-primary);
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    font-size: 13px;
    outline: none;
  }
  .tg-input:focus, .tg-select:focus { border-color: var(--accent); }
  .tg-select { min-width: 220px; max-width: 340px; }

  .tg-btn {
    border: none; border-radius: var(--radius-sm); padding: 9px 15px; font-size: 13px; font-weight: 600;
    cursor: pointer; display:inline-flex; align-items:center; gap:7px; transition: filter .15s, background .15s;
    background: var(--bg-card-hover); color: var(--text-primary); border: 1px solid var(--border-light);
  }
  .tg-btn:hover { filter: brightness(1.15); }
  .tg-btn.primary { background: var(--accent); color: #14100a; border-color: transparent; }
  .tg-btn.green { background: var(--green); color: #06180d; border-color: transparent; }
  .tg-btn.blue { background: var(--blue); color: #06121b; border-color: transparent; }
  .tg-btn.danger { background: var(--red-dim); color: #f3b6ae; border-color: rgba(231,76,60,0.35); }
  .tg-btn.sm { padding: 5px 10px; font-size: 12px; border-radius: 6px; }
  .tg-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .tg-layout { display:grid; grid-template-columns: minmax(430px, 46%) 1fr; gap:18px; align-items:start; }
  @media (max-width: 1100px) { .tg-layout { grid-template-columns: 1fr; } }

  .tg-card { background: var(--bg-card); border:1px solid var(--border); border-radius: var(--radius); overflow:hidden; }
  .tg-card + .tg-card { margin-top: 16px; }
  .tg-card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .tg-card-head h2 { font-size:14.5px; font-weight:700; }
  .tg-card-head .sub { font-size:12px; color:var(--text-muted); margin-top:2px; }
  .tg-card-body { padding: 14px 16px; }
  /* A wide table scrolls inside its card instead of being cut off by it (the
     card clips its rounded corners): on a phone the trainee's Final Grade
     column sat past the card's edge where nothing could reach it. Under 600px
     the fixed column widths also give way, so the unit list fits a phone. */
  .tg-card-body { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  @media (max-width: 600px) {
    body { padding: 10px; }
    .tg-card-body { padding: 10px; }
    .tg-table th { width: auto !important; }
    .tg-table th, .tg-table td { padding: 6px 5px; }
    .tg-table .unit-code { white-space: normal; overflow-wrap: anywhere; font-size: 12px; }
    .tg-select { min-width: 0; max-width: 100%; width: 100%; }
  }

  .tg-stats { display:grid; grid-template-columns: repeat(auto-fit, minmax(120px,1fr)); gap:10px; margin-bottom:14px; }
  .tg-stat { background: var(--bg-input); border:1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
  .tg-stat .v { font-size:19px; font-weight:700; }
  .tg-stat .l { font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; margin-top:2px; }

  table.tg-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .tg-table th { text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:0.5px; color:var(--text-muted); padding:8px 8px; border-bottom:1px solid var(--border-light); }
  .tg-table td { padding:7px 8px; border-bottom:1px solid var(--border); vertical-align:middle; }
  .tg-table tr:hover td { background: rgba(255,255,255,0.02); }
  .tg-table .unit-name { line-height:1.35; }
  .tg-table .unit-code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; color:var(--text-secondary); white-space:nowrap; }
  .tg-grade-input { width:74px; text-align:center; background:var(--bg-input); border:1px solid var(--border-light); color:var(--text-primary); border-radius:6px; padding:5px 6px; font-size:12.5px; outline:none; }
  .tg-date-input { width:112px; }
  .tg-grade-input:focus { border-color: var(--accent); }
  .tg-src { display:inline-block; font-size:12px; font-weight:700; letter-spacing:0.5px; padding:2px 7px; border-radius:20px; text-transform:uppercase; white-space:nowrap; }
  .tg-src.exam   { background: var(--green-dim); color: var(--green); }
  .tg-src.manual { background: var(--blue-dim); color: var(--blue); }
  .tg-src.none   { background: rgba(255,255,255,0.05); color: var(--text-muted); }
  .tg-src.pending { background: rgba(243,156,18,0.12); color: var(--accent); }
  tr.tg-dirty td { background: rgba(240,165,0,0.07); }
  tr.tg-dirty .tg-grade-input { border-color: var(--accent); }

  .tg-note { font-size:12px; color:var(--text-secondary); line-height:1.5; background:var(--bg-input); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; margin-bottom:12px; }
  .tg-note b { color: var(--text-primary); }
  .tg-check { display:flex; gap:8px; align-items:flex-start; font-size:12.5px; color:var(--text-secondary); margin:10px 0; line-height:1.4; }
  .tg-check input { margin-top:2px; accent-color: var(--accent); }

  .tg-field-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:10px; }
  .tg-field label { display:block; font-size:12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.4px; margin-bottom:5px; }
  .tg-field .tg-input { width:100%; }

  .tg-empty { text-align:center; color:var(--text-muted); padding:44px 20px; font-size:13.5px; line-height:1.6; }
  .tg-empty .big { font-size:34px; margin-bottom:10px; }

  /* ---------- Toasts ---------- */
  #tgToast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#0f1820; color:var(--text-primary); border:1px solid var(--border-light); border-left:4px solid var(--green); border-radius:10px; padding:12px 18px; font-size:13px; box-shadow:0 10px 30px rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:99999; max-width:90vw; }
  #tgToast.show { opacity:1; transform:translateX(-50%) translateY(-6px); }
  #tgToast.warn { border-left-color: var(--accent); }
  #tgToast.err { border-left-color: var(--red); }

  /* ======================================================================
     OFFICIAL TRANSCRIPT PREVIEW — replica of the approved paper transcript.
     Letter-and-a-half (8.5in × 14in legal) pages, dot-dot-dash blue page
     border, Garamond serif, and the exact four-column unit table.
     Rendered at 96dpi CSS pixels: 816 × 1344 per page.
     ====================================================================== */
  .tr-preview-wrap { background: #2b3442; border-radius: var(--radius); padding: 22px; overflow:auto; }
  .tr-preview-scale { transform-origin: top left; }
  .tr-page {
    position: relative;
    width: 816px; height: 1344px;
    background: #ffffff;
    color: #000;
    margin: 0 auto 26px;
    box-shadow: 0 12px 34px rgba(0,0,0,0.45);
    font-family: 'EB Garamond T', 'Adobe Garamond Pro', Garamond, 'Times New Roman', serif;
    overflow: hidden;
  }
  .tr-border {
    position:absolute; inset: 32px;              /* 24pt = 32px offset from page edge */
    border: 1.4px dashed #0070C0;                /* dot-dot-dash approximation */
    pointer-events:none;
  }
  /* Faithful dot-dot-dash: painted with a repeating gradient on 4 edges. */
  .tr-border { border: none; }
  .tr-border::before, .tr-border::after,
  .tr-border .v1, .tr-border .v2 { content:''; position:absolute; }
  .tr-border::before { top:0; left:0; right:0; height:1.4px;
    background: repeating-linear-gradient(90deg,#0070C0 0 2px,transparent 2px 5px,#0070C0 5px 7px,transparent 7px 10px,#0070C0 10px 18px,transparent 18px 21px); }
  .tr-border::after { bottom:0; left:0; right:0; height:1.4px;
    background: repeating-linear-gradient(90deg,#0070C0 0 2px,transparent 2px 5px,#0070C0 5px 7px,transparent 7px 10px,#0070C0 10px 18px,transparent 18px 21px); }
  .tr-border .v1 { top:0; bottom:0; left:0; width:1.4px;
    background: repeating-linear-gradient(180deg,#0070C0 0 2px,transparent 2px 5px,#0070C0 5px 7px,transparent 7px 10px,#0070C0 10px 18px,transparent 18px 21px); }
  .tr-border .v2 { top:0; bottom:0; right:0; width:1.4px;
    background: repeating-linear-gradient(180deg,#0070C0 0 2px,transparent 2px 5px,#0070C0 5px 7px,transparent 7px 10px,#0070C0 10px 18px,transparent 18px 21px); }

  /* Content sits fully inside the 32px page border (top 46px = border + 14px)
     so the institution name never clips through the border line. */
  .tr-content { position:absolute; left:96px; right:96px; top:46px; bottom:42px; }
  .tr-head { position:relative; }
  .tr-crest { position:absolute; left:0; top:6px; width:150px; height:150px; }
  .tr-inst { text-align:right; font-size:13.5px; line-height:1.32; padding-top:2px; }
  .tr-inst .nm { font-weight:700; font-size:14.5px; line-height:1.25; }
  .tr-inst .email a, .tr-inst .email span { color:#0563C1; text-decoration:underline; }
  .tr-title { text-align:center; font-weight:700; font-size:15px; letter-spacing:0.4px; margin-top:8px; }
  .tr-bio { margin-top:10px; font-size:13px; line-height:1.45; }
  .tr-bio-row { display:flex; }
  .tr-bio-row .left { flex:1 1 auto; padding-right:14px; }
  .tr-bio-row .right { flex:0 0 200px; }
  .tr-dots { font-size:12px; letter-spacing:1px; color:#000; overflow:hidden; white-space:nowrap; margin-top:4px; }
  .tr-qual { text-align:center; font-weight:700; font-size:13.5px; margin:10px 0 6px; letter-spacing:0.2px; }

  table.tr-units { width:100%; border-collapse:collapse; font-size:12px; line-height:1.25; table-layout:fixed; }
  .tr-units col.c1 { width:19.86%; } .tr-units col.c2 { width:46.51%; }
  .tr-units col.c3 { width:19.43%; } .tr-units col.c4 { width:14.2%; }
  .tr-units th, .tr-units td { border:1px solid #000; padding:2px 6px; vertical-align:top; }
  .tr-units th { font-weight:700; text-align:center; font-size:12px; }
  .tr-units td.code { text-align:left; }
  .tr-units td.name { text-align:left; }
  .tr-units td.ce, .tr-units td.grade { text-align:center; }

  /* Hidden measurer used to paginate rows exactly like the paper layout. */
  #trMeasure { position:absolute; left:-9999px; top:0; width:816px; visibility:hidden; }

  @media print {
    body * { visibility: hidden; }
  }

/* Minimum readable text (12px). Many sizes in this page's templates are set
   inline (style="font-size:11px"), where no stylesheet rule reaches them:
   this lifts each of those spellings to 12px. Screen only - a printed
   page, and every printed document (its own window), keeps its sizes. */
@media screen {
  [style*="font-size:10.5px"], [style*="font-size: 10.5px"] { font-size:12px !important; }
}
</style>
</head>
<body>

<div id="tgApp"></div>

<div id="tgToast"></div>
<div id="trMeasure" aria-hidden="true"></div>

<script>
'use strict';
/* ============================================================================
   Transcript / Grades — one page, three roles (set by ?role= URL param):
     admin / adminstaff : input section + exact live transcript preview +
                          Transcript PDF & Grade Sheet PDF downloads +
                          manual grade override (optionally writing back to
                          the live VocTrain exam result) + unit catalogue editor.
     instructor         : live grade tables for the instructor's trainees +
                          Grade Sheet download (carries the instructor's name).
     student            : the trainee's own live unit/grade view + "Request
                          Transcript / Certificate" buttons feeding the Admin
                          "Certificate/Transcript Requests" queue.

   Grades resolve through CESTISCore.Transcript.effectiveGrades — live VocTrain
   exam results first, manual Admin overrides always winning — so every role
   sees identical numbers, updating in real time (storage events + polling).
   ============================================================================ */

var T = window.CESTISCore && CESTISCore.Transcript;
var ASSETS = window.CESTIS_TRANSCRIPT_ASSETS || {};
var CREST_DATA_URI = 'data:image/png;base64,' + (ASSETS.crestPng || '');

function param(name) {
  try { var v = new URLSearchParams(location.search).get(name); return v ? v : ''; }
  catch (e) { return ''; }
}
// WHO is looking comes from the signed-in dashboard session, never from the
// address: '?role=' used to default to 'admin' (so the bare URL opened the
// grade editor and every trainee's personal details to anyone on a synced
// device) and '?studentId=' picked whose grades a trainee saw. The address may
// only narrow the view; with no live session the page shows nothing
// (CESTISCore.sessionAccess).
var VIEWER = (window.CESTISCore && CESTISCore.sessionAccess)
  ? CESTISCore.sessionAccess.forPage({ allowed: ['admin', 'adminstaff', 'instructor', 'student'] })
  : { ok: false, message: 'Shared data core failed to load. Please refresh.' };
var ROLE = VIEWER.ok ? VIEWER.role : '';
var IS_STAFF = (ROLE === 'admin' || ROLE === 'adminstaff');
var MY_STUDENT_ID = VIEWER.ok ? (VIEWER.studentId || '') : '';
var _acctName = (VIEWER.ok && VIEWER.account && VIEWER.account.name) || '';
// A trainee is named by their own account; an instructor's grade sheet keeps
// the instructor-record name the dashboard hands over (it only chooses which
// of the Centre's trainees a member of staff sees).
var MY_NAME = !VIEWER.ok ? '' : (ROLE === 'student' ? _acctName : (param('name') || _acctName));
var MY_COURSE = param('course');
// Every programme an instructor teaches ('|'-separated); MY_COURSE alone when
// the host passes just the one.
var MY_COURSES = (param('courses') || MY_COURSE).split('|').map(function (c) { return c.trim(); })
  .filter(function (c, i, a) { return c && a.indexOf(c) === i; });
var ACTOR = (VIEWER.ok && VIEWER.account && VIEWER.account.name) || (IS_STAFF ? 'Admin' : MY_NAME || ROLE);

/* ------------------------------ data access ------------------------------ */
function readJSON(key, fallback) {
  try { var v = JSON.parse(CESTISStore.getItem(key) || 'null'); return (v == null) ? fallback : v; }
  catch (e) { return fallback; }
}
function writeJSON(key, val) { CESTISStore.setItem(key, JSON.stringify(val)); }
/* The list as stored right now, falling back to this page's copy only when
   nothing readable is stored. */
function freshList(key, cached) {
  var v = readJSON(key, null);
  return Array.isArray(v) ? v : (Array.isArray(cached) ? cached : []);
}

var db = { students: [], exams: [], examResults: [], catalogs: [], grades: [], requests: [], profiles: {}, instructors: [] };

function loadAll() {
  db.students = readJSON('voctrain_students', []);
  db.exams = readJSON('voctrain_exams', []);
  db.examResults = readJSON('voctrain_examResults', []);
  db.grades = readJSON(T.KEYS.grades, []);
  db.requests = readJSON(T.KEYS.requests, []);
  db.profiles = readJSON(T.KEYS.profiles, {});
  db.instructors = readJSON('voctrain_instructorData', []);
  // The seeded catalogues are added when READ, never written at start-up.
  // Writing them here stamped pristine seeds "now" before the page's cloud
  // pull had landed, and after an administrator's logout that newer stamp beat
  // the catalogues they had edited — in this browser and then in Drive. They
  // are stored the first time an administrator actually saves a catalogue.
  db.catalogs = T.ensureSeeded(readJSON(T.KEYS.catalogs, []));
  // One pass over the results for the whole render (T.gradeIndex): resolving
  // grades used to scan every result for every unit of every trainee.
  db.index = T.gradeIndex(db.exams, db.examResults, db.catalogs);
}

// Tell the host LMS the transcript data changed so it reloads its in-memory
// copies, refreshes badges and pushes the change to cloud sync.
function notifyHost(extra) {
  try { window.top.postMessage(Object.assign({ type: 'transcript-data-updated' }, extra || {}), '*'); } catch (e) {}
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function escAttr(s) { return esc(s).replace(/\n/g, ' '); }
// A value handed to an inline handler: a quoted JavaScript string that
// survives the browser decoding the attribute first (\'...\' with &#39;
// inside did not). The shared toolkit does it; the fallback covers a stale
// cached cestis-core.js.
function jsArg(s) {
  if (window.CESTISCore && CESTISCore.html) return CESTISCore.html.jsArg(s);
  return esc(JSON.stringify(String(s == null ? '' : s)));
}

var toastTimer = null;
function toast(msg, kind) {
  var el = document.getElementById('tgToast');
  el.textContent = msg;
  el.className = 'show' + (kind ? ' ' + kind : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.className = ''; }, 3200);
}

/* --------------------------- shared helpers --------------------------- */
function studentById(id) {
  return db.students.filter(function (s) { return s && s.id === id; })[0] || null;
}
function profileFor(id) { return db.profiles[id] || {}; }

/* The transcript header. What was typed on this page wins; otherwise what the
   Centre already recorded: the roll's TRN (the record stores it as `trn`, which
   this never looked at, so every header had to be re-keyed), then the School
   Fee record's national ID; and, for a trainee on a second programme, the
   header saved on their other enrolment (the same person by TRN or date of
   birth — T.otherEnrolments). */
function feeNationalIdFor(student) {
  try {
    var fee = readJSON('cestiSchoolFeeStudents', []);
    var twin = CESTISCore.feeTwinIndex(Array.isArray(fee) ? fee : []).find(student);
    return (twin && (twin.nationalId || twin.trn)) || '';
  } catch (e) { return ''; }
}
function headerInfo(student) {
  var p = student ? profileFor(student.id) : {};
  var linked = {};
  if (student && (!p.dob || !p.address || !p.idNo)) {
    T.otherEnrolments(student, db.students, db.profiles, true).some(function (o) {
      var op = profileFor(o.student.id);
      if (op.dob || op.address || op.idNo) { linked = op; return true; }
      return false;
    });
  }
  return {
    name: (student && student.name) || '',
    dob: p.dob || (student && student.dob) || linked.dob || '',
    address: p.address || (student && student.address) || linked.address || '',
    idNo: p.idNo || (student && (student.trn || student.TRN || student.idNo || student.idNumber || student.nationalId)) ||
          (student ? feeNationalIdFor(student) : '') || linked.idNo || ''
  };
}

function qualById(id) { return db.catalogs.filter(function (q) { return q && q.id === id; })[0] || null; }
// The plan a trainee's transcript is printed from: the copy taken when it was
// first issued (T.issuedQualFor) — so a later catalogue edit never rewrites a
// graduate's transcript — else the live catalogue.
function qualForStudent(studentId, qualId) {
  return (studentId && qualId && T.issuedQualFor(db.profiles, studentId, qualId)) || qualById(qualId);
}

function rowsFor(studentId, qual) {
  return T.effectiveGrades({
    qual: qual, studentId: studentId,
    exams: db.exams, examResults: db.examResults, manualGrades: db.grades,
    catalogs: db.catalogs, index: db.index
  });
}

function instructorNameFor(student) {
  if (!student) return '';
  if (student.instructor) return student.instructor;
  var c = T.normText(student.course);
  var hit = db.instructors.filter(function (i) {
    if (!i) return false;
    var ic = T.normText(i.course);
    return ic && c && (ic === c || ic.indexOf(c) !== -1 || c.indexOf(ic) !== -1);
  })[0];
  return hit ? hit.name : '';
}

/* ============================================================================
   OFFICIAL TRANSCRIPT RENDERING (exact replica of the approved document)
   ============================================================================ */
function trHeaderHTML(info) {
  var I = T.INSTITUTION;
  return '' +
    '<div class="tr-head">' +
      '<img class="tr-crest" src="' + CREST_DATA_URI + '" alt="">' +
      '<div class="tr-inst">' +
        '<div class="nm">' + esc(I.nameLine1) + '<br>' + esc(I.nameLine2) + '</div>' +
        '<div style="height:8px;"></div>' +
        '<div>' + esc(I.centre) + '</div>' +

/* Paginate by measuring real row heights at the real page width, mirroring
   how the paper document flows onto continuation pages. */
function paginateTranscript(info, qualTitle, rows) {
  var measure = document.getElementById('trMeasure');
  var PAGE_INNER = 1344 - 46 - 42;   /* content top/bottom offsets (.tr-content) */
  measure.innerHTML =
    '<div class="tr-page" style="height:auto;box-shadow:none;"><div class="tr-content" style="position:static;padding:0 0;width:624px;margin:0;">' +
      '<div id="trmHead">' + trHeaderHTML(info) + '<div class="tr-dots" id="trmDots">' + Array(400).join('.') + '</div><div class="tr-qual" id="trmQual">' + esc(qualTitle) + '</div></div>' +
      trTableOpen() + rows.map(trUnitRowHTML).join('') + '</table>' +
    '</div></div>';
  var headEl = measure.querySelector('#trmHead');
  var headH = headEl ? headEl.offsetHeight : 330;
  var dotsEl = measure.querySelector('#trmDots');
  var qualEl = measure.querySelector('#trmQual');
  var dotsQualH = (dotsEl ? dotsEl.offsetHeight : 18) + (qualEl ? qualEl.offsetHeight : 28);
  var headerOnlyH = headH - dotsQualH;
  var trEls = measure.querySelectorAll('.tr-units tr');
  var thH = trEls.length ? trEls[0].offsetHeight : 24;
  var pages = [];
  var current = [], avail = PAGE_INNER - headH - thH - 8;
  for (var i = 1; i < trEls.length; i++) {
    var h = trEls[i].offsetHeight;
    if (h > avail && current.length) {
      pages.push(current);
      current = [];
      avail = PAGE_INNER - headerOnlyH - thH - 20;
    }
    current.push(rows[i - 1]);
    avail -= h;
  }
  if (current.length || !pages.length) pages.push(current);
  measure.innerHTML = '';
  return pages;
}

function renderTranscriptPreviewHTML(student, qual) {
  if (!student || !qual) return '<div class="tg-empty"><div class="big">📜</div>Select a trainee and qualification to preview the transcript.</div>';
  var info = headerInfo(student);
  var rows = rowsFor(student.id, qual);
  var pages = paginateTranscript(info, qual.title, rows);
  return pages.map(function (pageRows, pi) {
    return '<div class="tr-page">' +
      '<div class="tr-border"><span class="v1"></span><span class="v2"></span></div>' +
      '<div class="tr-content">' +
        trHeaderHTML(info) +
        (pi === 0 ? '<div class="tr-dots">' + Array(400).join('.') + '</div><div class="tr-qual">' + esc(qual.title) + '</div>' : '<div style="height:14px;"></div>') +
        trTableOpen() + pageRows.map(trUnitRowHTML).join('') + '</table>' +
      '</div>' +
    '</div>';
  }).join('');
}

/* ============================================================================
   PDF GENERATION
   ============================================================================ */
function pdfDoc(format, orientation) {
  var JS = window.jspdf && window.jspdf.jsPDF;
  if (!JS) { toast('PDF library not loaded', 'err'); return null; }
  var doc = new JS({ orientation: orientation || 'portrait', unit: 'pt', format: format });
  try {
    doc.addFileToVFS('EBGaramond-Regular.ttf', ASSETS.garamondRegular);
    doc.addFont('EBGaramond-Regular.ttf', 'EBGaramond', 'normal');
    doc.addFileToVFS('EBGaramond-Bold.ttf', ASSETS.garamondBold);
    doc.addFont('EBGaramond-Bold.ttf', 'EBGaramond', 'bold');
  } catch (e) { /* falls back to Times below */ }
  return doc;
}
function setSerif(doc, style, size) {
  try { doc.setFont('EBGaramond', style); } catch (e) { doc.setFont('times', style); }
  doc.setFontSize(size);
}

/* ---- Official Transcript PDF (8.5in × 14in, exact replica) ---- */
/* TR_TOP keeps the header clear of the dashed page border drawn at 24pt —
   with an 11pt heading the first baseline lands at TR_TOP+12, so anything
   below ~30 puts the institution name through the border line. */
var TR_PAGE_W = 612, TR_PAGE_H = 1008, TR_MARGIN_X = 72, TR_TOP = 36, TR_BOTTOM = 32;
var TR_COLW = [0.1986, 0.4651, 0.1943, 0.142].map(function (f) { return f * (TR_PAGE_W - 2 * TR_MARGIN_X); });

function trPdfBorder(doc) {
  doc.setDrawColor(0, 112, 192);
  doc.setLineWidth(1);
  try { doc.setLineDashPattern([1.5, 2.2, 1.5, 2.2, 6, 2.2], 0); } catch (e) {}
  doc.rect(24, 24, TR_PAGE_W - 48, TR_PAGE_H - 48);
  try { doc.setLineDashPattern([], 0); } catch (e) {}
  doc.setDrawColor(0);
}

function trPdfHeader(doc, info) {
  var I = T.INSTITUTION, rightX = TR_PAGE_W - TR_MARGIN_X;
  trPdfBorder(doc);
  try { doc.addImage(CREST_DATA_URI, 'PNG', TR_MARGIN_X, TR_TOP + 6, 112, 112); } catch (e) {}
  var y = TR_TOP + 12;
  setSerif(doc, 'bold', 11);
  doc.text(I.nameLine1, rightX, y, { align: 'right' }); y += 13;
  doc.text(I.nameLine2, rightX, y, { align: 'right' }); y += 19;
  setSerif(doc, 'normal', 10);
  [I.centre].concat(I.addressLines).forEach(function (l) { doc.text(l, rightX, y, { align: 'right' }); y += 12.5; });
  var emailLabel = 'Email: ', emailTxt = I.email;
  var wLbl = doc.getTextWidth(emailLabel), wEm = doc.getTextWidth(emailTxt);
  doc.text(emailLabel, rightX - wEm - wLbl, y, { align: 'left' });
  doc.setTextColor(5, 99, 193);
  doc.text(emailTxt, rightX - wEm, y, { align: 'left' });
  doc.setLineWidth(0.6); doc.setDrawColor(5, 99, 193);
  doc.line(rightX - wEm, y + 1.5, rightX, y + 1.5);
  doc.setTextColor(0); doc.setDrawColor(0);
  y += 12.5;
  doc.text('Tel: ' + I.tel, rightX, y, { align: 'right' }); y += 12.5;

  var yTitle = Math.max(y, TR_TOP + 126) + 6;
  setSerif(doc, 'bold', 12);
  doc.text('TRANSCRIPT', TR_PAGE_W / 2, yTitle, { align: 'center' });

  var yBio = yTitle + 18, rightCol = TR_PAGE_W - TR_MARGIN_X - 150;
  setSerif(doc, 'normal', 10);
  doc.text('Name: ' + info.name, TR_MARGIN_X, yBio);
  doc.text('D.O.B: ' + info.dob, rightCol, yBio);
  yBio += 14;
  var addrLines = doc.splitTextToSize('Address: ' + info.address, rightCol - TR_MARGIN_X - 16);
  doc.text(addrLines, TR_MARGIN_X, yBio);
  doc.text('ID No: ' + info.idNo, rightCol, yBio);
  return yBio + addrLines.length * 12 + 6;
}

function trPdfTableHeader(doc, y) {
  var x = TR_MARGIN_X, h = 26;
  setSerif(doc, 'bold', 8.5);
  doc.setLineWidth(0.75);
  var heads = ['UNIT CODE', 'UNIT NAME', 'Core/Elective', 'FINAL\nGRADE'];
  for (var c = 0; c < 4; c++) {
    doc.rect(x, y, TR_COLW[c], h);
    var lines = heads[c].split('\n');
    var ty = y + h / 2 - (lines.length - 1) * 4.5 + 3;
    lines.forEach(function (l, li) { doc.text(l, x + TR_COLW[c] / 2, ty + li * 9, { align: 'center' }); });
    x += TR_COLW[c];
  }
  return y + h;
}

function generateTranscriptPDF(student, qual) {
  var doc = pdfDoc([TR_PAGE_W, TR_PAGE_H]);
  if (!doc) return;
  var info = headerInfo(student);
  var rows = rowsFor(student.id, qual);
  var y = trPdfHeader(doc, info);

  /* page-1 dotted rule (margin to margin) + qualification title */
  setSerif(doc, 'normal', 8.5);
  var dotW = doc.getTextWidth('.') || 2;
  var dotCount = Math.max(1, Math.floor((TR_PAGE_W - 2 * TR_MARGIN_X) / dotW));
  doc.text(new Array(dotCount + 1).join('.'), TR_MARGIN_X, y + 8);
  y += 20;
  setSerif(doc, 'bold', 10.5);
  doc.text(qual.title, TR_PAGE_W / 2, y, { align: 'center' });
  y += 8;
  y = trPdfTableHeader(doc, y);

  setSerif(doc, 'normal', 8.5);
  var PAD = 4, LH = 9.6;
  rows.forEach(function (r) {
    var nameLines = doc.splitTextToSize(String(r.name || ''), TR_COLW[1] - 2 * PAD);
    var h = Math.max(14, nameLines.length * LH + 5);
    if (y + h > TR_PAGE_H - TR_BOTTOM) {
      doc.addPage([TR_PAGE_W, TR_PAGE_H]);
      y = trPdfHeader(doc, info) + 12;
      y = trPdfTableHeader(doc, y);
      setSerif(doc, 'normal', 8.5);
    }
    var x = TR_MARGIN_X;
    doc.setLineWidth(0.75);
    for (var c = 0; c < 4; c++) { doc.rect(x, y, TR_COLW[c], h); x += TR_COLW[c]; }
    doc.text(String(r.code || ''), TR_MARGIN_X + PAD, y + 10);
    doc.text(nameLines, TR_MARGIN_X + TR_COLW[0] + PAD, y + 10);
    doc.text(String(r.coreElective || 'Core'), TR_MARGIN_X + TR_COLW[0] + TR_COLW[1] + TR_COLW[2] / 2, y + 10, { align: 'center' });
    doc.text(T.displayGrade(r), TR_MARGIN_X + TR_COLW[0] + TR_COLW[1] + TR_COLW[2] + TR_COLW[3] / 2, y + 10, { align: 'center' });
    y += h;
  });

  doc.save('Transcript - ' + (info.name || 'Trainee') + '.pdf');
}

/* ---- Grade Results Sheet PDF (professional A4, with instructor name) ---- */
function generateGradeSheetPDF(student, qual) {
  var doc = pdfDoc('a4');
  if (!doc) return;
  var W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight();
  var M = 46;
  var info = headerInfo(student);
  var rows = rowsFor(student.id, qual);
  var stats = T.gradeStats(rows, qual);
  var instructor = instructorNameFor(student);
  var GREEN = [11, 122, 62], DARK = [16, 42, 28], GREY = [110, 120, 130];

  function sheetHeader() {
    doc.setFillColor(GREEN[0], GREEN[1], GREEN[2]);
    doc.rect(0, 0, W, 6, 'F');
    try { doc.addImage(CREST_DATA_URI, 'PNG', M, 20, 64, 64); } catch (e) {}
    setSerif(doc, 'bold', 14);
    doc.setTextColor(DARK[0], DARK[1], DARK[2]);
    doc.text(T.INSTITUTION.nameLine1, M + 78, 38);
    doc.text(T.INSTITUTION.nameLine2, M + 78, 54);
    setSerif(doc, 'normal', 9);
    doc.setTextColor(GREY[0], GREY[1], GREY[2]);
    doc.text(T.INSTITUTION.centre + ' — ' + T.INSTITUTION.addressLines.join(', '), M + 78, 68);
    doc.text('Email: ' + T.INSTITUTION.email + '   Tel: ' + T.INSTITUTION.tel, M + 78, 80);
    doc.setTextColor(0);
    doc.setDrawColor(GREEN[0], GREEN[1], GREEN[2]);
    doc.setLineWidth(1.2);
    doc.line(M, 94, W - M, 94);
    setSerif(doc, 'bold', 13);
    doc.setTextColor(GREEN[0], GREEN[1], GREEN[2]);
    doc.text('OFFICIAL GRADE RESULTS SHEET', W / 2, 114, { align: 'center' });
    doc.setTextColor(0);
    return 128;
  }

  var y = sheetHeader();
  /* trainee / programme info panel — the programme title gets a full-width
     row so long qualification names never collide with the right column. */
  doc.setFillColor(243, 247, 244);
  doc.setDrawColor(210, 220, 214);
  doc.setLineWidth(0.8);
  doc.roundedRect(M, y, W - 2 * M, 82, 5, 5, 'FD');
  var colA = M + 12, colB = W / 2 + 6, ly = y + 16;
  function infoLine(x, yy, label, value, maxRight) {
    setSerif(doc, 'bold', 9.5); doc.text(label, x, yy);
    var vx = x + doc.getTextWidth(label) + 4;
    setSerif(doc, 'normal', 9.5);
    var v = String(value || '—');
    var avail = (maxRight || (W - M - 12)) - vx;
    var lines = doc.splitTextToSize(v, avail);
    doc.text(lines.length > 1 ? lines[0].replace(/\s+\S*$/, '') + '…' : lines[0], vx, yy);
  }
  infoLine(colA, ly, 'Trainee:', info.name, colB - 10);
  infoLine(colB, ly, 'ID No:', info.idNo);
  infoLine(colA, ly + 16, 'Programme:', qual.title);
  infoLine(colA, ly + 32, 'Instructor:', instructor || 'Not assigned', colB - 10);
  infoLine(colB, ly + 32, 'D.O.B:', info.dob);
  infoLine(colA, ly + 48, 'Training Centre:', qual.centre || T.INSTITUTION.centre, colB - 10);
  infoLine(colB, ly + 48, 'Skill Area:', qual.skillArea || student.course || '');
  infoLine(colA, ly + 64, 'Issued:', T.formatDateDMY(new Date().toISOString()));
  y += 96;

  /* table */
  var cw = [(W - 2 * M) * 0.17, (W - 2 * M) * 0.43, (W - 2 * M) * 0.14, (W - 2 * M) * 0.13, (W - 2 * M) * 0.13];
  function tableHead(yy) {
    doc.setFillColor(GREEN[0], GREEN[1], GREEN[2]);
    doc.rect(M, yy, W - 2 * M, 20, 'F');
    setSerif(doc, 'bold', 8.5);
    doc.setTextColor(255);
    var x = M;
    [['UNIT CODE', 'left'], ['UNIT NAME', 'left'], ['DATE', 'center'], ['FINAL GRADE', 'center'], ['RESULT', 'center']].forEach(function (hcol, i) {
      doc.text(hcol[0], hcol[1] === 'left' ? x + 6 : x + cw[i] / 2, yy + 13.5, { align: hcol[1] });
      x += cw[i];
    });
    doc.setTextColor(0);
    return yy + 20;
  }
  y = tableHead(y);
  setSerif(doc, 'normal', 8.5);
  rows.forEach(function (r, idx) {
    var nameLines = doc.splitTextToSize(String(r.name || ''), cw[1] - 12);
    var h = Math.max(16, nameLines.length * 9.4 + 7);
    if (y + h > H - 130) {
      doc.addPage('a4');
      y = sheetHeader() + 6;
      y = tableHead(y);
      setSerif(doc, 'normal', 8.5);
    }
    if (idx % 2 === 1) { doc.setFillColor(245, 248, 246); doc.rect(M, y, W - 2 * M, h, 'F'); }
    var graded = r.grade != null && r.grade !== '';
    // The result by the one rule every output uses (T.resultForRow): the
    // exam's own pass mark, else the unit's / the plan's, else 60 — and a
    // recorded "Competent" / "NYC" is a result, not PENDING.
    var result = T.resultForRow(r, qual);
    doc.setTextColor(0);
    doc.text(String(r.code || ''), M + 6, y + 11);
    doc.text(nameLines, M + cw[0] + 6, y + 11);
    doc.text(String(r.date || '—'), M + cw[0] + cw[1] + cw[2] / 2, y + 11, { align: 'center' });
    setSerif(doc, 'bold', 8.5);
    doc.text(graded || r.source === 'pending' ? T.displayGrade(r) : '—', M + cw[0] + cw[1] + cw[2] + cw[3] / 2, y + 11, { align: 'center' });
    if (result !== 'PENDING') {
      var pass = result === 'COMPETENT';
      doc.setTextColor(pass ? GREEN[0] : 180, pass ? GREEN[1] : 40, pass ? GREEN[2] : 30);
      doc.text(pass ? 'COMPETENT' : 'NYC', M + cw[0] + cw[1] + cw[2] + cw[3] + cw[4] / 2, y + 11, { align: 'center' });
    } else {
      doc.setTextColor(GREY[0], GREY[1], GREY[2]);
      doc.text('PENDING', M + cw[0] + cw[1] + cw[2] + cw[3] + cw[4] / 2, y + 11, { align: 'center' });
    }
    doc.setTextColor(0);
    setSerif(doc, 'normal', 8.5);
    doc.setDrawColor(228, 234, 230);
    doc.setLineWidth(0.5);
    doc.line(M, y + h, W - M, y + h);
    y += h;
  });

  /* summary + signatures */
  y += 14;
  if (y > H - 120) { doc.addPage('a4'); y = sheetHeader() + 10; }
  doc.setFillColor(243, 247, 244);
  doc.setDrawColor(210, 220, 214);
  doc.roundedRect(M, y, W - 2 * M, 34, 5, 5, 'FD');
  setSerif(doc, 'bold', 9.5);
  doc.text('Units competent: ' + stats.competent + ' of ' + stats.total, M + 12, y + 21);
  doc.text('Average of % grades: ' + (stats.average == null ? '—' : T.formatGrade(stats.average)), W / 2 - 40, y + 21);
  doc.text('Units graded: ' + (stats.total ? Math.round(stats.graded / stats.total * 100) : 0) + '%', W - M - 110, y + 21);
  y += 66;
  doc.setDrawColor(120, 130, 125);
  doc.setLineWidth(0.8);
  doc.line(M, y, M + 170, y);
  doc.line(W - M - 170, y, W - M, y);
  setSerif(doc, 'normal', 8.5);
  doc.setTextColor(GREY[0], GREY[1], GREY[2]);
  doc.text('Instructor: ' + (instructor || ''), M, y + 12);
  doc.text('Training Director', W - M - 170, y + 12);
  doc.text('Generated by C.E.S.T.I.S VocTrain — ' + T.formatDateDMY(new Date().toISOString()), W / 2, H - 24, { align: 'center' });
  doc.save('Grade Sheet - ' + (info.name || 'Trainee') + '.pdf');
}

  var html = '<option value="">— Select trainee —</option>';
  Object.keys(groups).sort().forEach(function (c) {
    html += '<optgroup label="' + escAttr(c) + '">';
    groups[c].sort(function (a, b) { return String(a.name).localeCompare(String(b.name)); }).forEach(function (s) {
      html += '<option value="' + escAttr(s.id) + '"' + (s.id === sel.studentId ? ' selected' : '') + '>' + esc(s.name) + '</option>';
    });
    html += '</optgroup>';
  });
  el.innerHTML = html;
}

function fillQualSelect() {
  var el = document.getElementById('tgQualSel');
  if (!el) return;
  el.innerHTML = '<option value="">— Select qualification —</option>' + db.catalogs.map(function (q) {
    return '<option value="' + escAttr(q.id) + '"' + (q.id === sel.qualId ? ' selected' : '') + '>' + esc(q.title) + ' (' + q.units.length + ' units)</option>';
  }).join('');
}

/* Typed-but-unsaved work survives a redraw. Saving one row, or the page
   refreshing itself (another device saved, an exam was marked — the 5 s
   check), rebuilt every input from storage and wiped what had been typed in
   the other rows and in the header. Values that differ from what is stored are
   remembered BY UNIT CODE (a catalogue edit can reorder the rows) and put back,
   and their rows are marked as unsaved. */
var dirtyGrades = {};      // unit code -> { g, d } for the current trainee + plan
var dirtyFor = '';         // which trainee|plan the dirty values belong to
function captureDirtyGrades() {
  var key = sel.studentId + '|' + sel.qualId;
  var tbody = document.getElementById('tgGradeRows');
  if (!tbody) return;
  if (dirtyFor !== key) { dirtyGrades = {}; dirtyFor = key; }
  var rows = tbody.querySelectorAll('tr[data-code]');
  for (var i = 0; i < rows.length; i++) {
    var code = rows[i].getAttribute('data-code');
    var g = rows[i].querySelector('.tg-grade-input:not(.tg-date-input)'), d = rows[i].querySelector('.tg-date-input');
    if (!g || !d) continue;
    if (g.value !== g.getAttribute('data-stored') || d.value !== d.getAttribute('data-stored')) dirtyGrades[code] = { g: g.value, d: d.value };
    else delete dirtyGrades[code];
  }
}
function markDirtyRow(el) {
  var tr = el && el.closest ? el.closest('tr') : null;
  if (tr) tr.classList.add('tg-dirty');
}

function onPickStudent(id) {
  sel.studentId = id;
  /* Re-sync the qualification to the newly picked trainee's own plan (a
     qualification pinned on the record, else their course). When no
     catalogue matches, clear the selection — never leave the previous
     trainee's skill area showing. */
  var s = studentById(id);
  var q = s ? T.qualForTrainee(db.catalogs, s) : null;
  sel.qualId = q ? q.id : '';
  dirtyGrades = {}; dirtyFor = ''; profileDirtyFor = '';
  renderAdmin();
}
function onPickQual(id) { sel.qualId = id; dirtyGrades = {}; dirtyFor = ''; renderAdmin(); }

var profileDirtyFor = '';   // the trainee whose header inputs hold unsaved typing
function renderProfileInputs() {
  var s = studentById(sel.studentId);
  var d = document.getElementById('tgpDob'), a = document.getElementById('tgpAddr'), i = document.getElementById('tgpIdNo');
  // Half-typed header details are not reset by a redraw for the same trainee.
  if (profileDirtyFor && profileDirtyFor === sel.studentId) return;
  var info = s ? headerInfo(s) : { dob: '', address: '', idNo: '' };
  if (d) d.value = info.dob; if (a) a.value = info.address; if (i) i.value = info.idNo;
  var src = document.getElementById('tgpIdSrc');
  if (src) src.textContent = (s && !profileFor(s.id).idNo && info.idNo) ? '(from the trainee\'s record)' : '';
  [d, a, i].forEach(function (el) {
    if (el && !el._tgWired) { el._tgWired = true; el.addEventListener('input', function () { profileDirtyFor = sel.studentId; }); }
  });
}

function saveProfile() {
  if (!sel.studentId) { toast('Select a trainee first', 'warn'); return; }
  // Re-read before writing, and keep what else the profile holds (the issued
  // catalogue copies); stamped so the newer header wins when two copies meet.
  db.profiles = readJSON(T.KEYS.profiles, {}) || {};
  var prev = db.profiles[sel.studentId] || {};
  db.profiles[sel.studentId] = Object.assign({}, prev, {
    dob: document.getElementById('tgpDob').value.trim(),
    address: document.getElementById('tgpAddr').value.trim(),
    idNo: document.getElementById('tgpIdNo').value.trim(),
    updatedAt: new Date().toISOString()
  });

  profileDirtyFor = '';
  notifyHost();
  refreshPreview();
  toast('Trainee details saved');
}

function renderGradeRows() {
  var tbody = document.getElementById('tgGradeRows');
  var sub = document.getElementById('tgGradesSub');
  var statsEl = document.getElementById('tgStats');
  if (!tbody) return;
  captureDirtyGrades();
  var s = studentById(sel.studentId), q = qualForStudent(sel.studentId, sel.qualId);
  var issuedEl = document.getElementById('tgIssuedNote');
  var orphEl = document.getElementById('tgOrphans');
  var otherEl = document.getElementById('tgOtherEnrolments');
  if (issuedEl) issuedEl.innerHTML = '';
  if (orphEl) orphEl.innerHTML = '';
  if (otherEl) otherEl.innerHTML = '';
  if (!s || !q) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-muted);padding:22px 8px;text-align:center;">Select a trainee and a qualification to manage grades.</td></tr>';
    if (sub) sub.textContent = '';
    if (statsEl) statsEl.innerHTML = '';
    return;
  }
  if (!q.units.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="color:var(--text-muted);padding:22px 8px;text-align:center;">This qualification has no units yet — add them via “Edit Unit Catalogue”.</td></tr>';
  }
  var rows = rowsFor(s.id, q);
  var stats = T.gradeStats(rows, q);
  if (sub) sub.textContent = s.name + ' — ' + q.title;
  /* One set of figures, each saying what it counts: units achieved by the pass
     rule, the average of the PERCENTAGE grades only (a recorded "Competent" is
     not a 0), and how many units carry any grade. */
  if (statsEl) statsEl.innerHTML =
    '<div class="tg-stat"><div class="v">' + stats.competent + '/' + stats.total + '</div><div class="l">Units competent</div></div>' +
    '<div class="tg-stat"><div class="v">' + (stats.average == null ? '—' : T.formatGrade(stats.average)) + '</div><div class="l">Average of % grades</div></div>' +
    '<div class="tg-stat"><div class="v">' + (stats.total ? Math.round(stats.graded / stats.total * 100) : 0) + '%</div><div class="l">Units graded' + (stats.nyc ? ' · ' + stats.nyc + ' NYC' : '') + (stats.pending ? ' · ' + stats.pending + ' awaiting marking' : '') + '</div></div>';
  if (issuedEl && q.issuedSnapshot) {
    issuedEl.innerHTML = '<div class="tg-note">This trainee\'s transcript was issued on <b>' + esc(T.formatDateDMY(q.issuedAt)) +
      '</b> and is printed from the unit list as it was then, so later catalogue edits do not change it. ' +
      '<button class="tg-btn sm" onclick="reissueWithCurrentCatalogue()">Use the current catalogue instead</button></div>';
  }
  tbody.innerHTML = rows.map(function (r, i) {
    var srcLabel = r.source === 'exam' ? 'Live exam' : (r.source === 'manual' ? 'Manual' : (r.source === 'pending' ? 'Awaiting marking' : '—'));
    var storedG = r.grade == null ? '' : String(r.grade), storedD = r.date || '';
    var dirty = dirtyGrades[r.code];
    return '<tr data-code="' + escAttr(r.code) + '"' + (dirty ? ' class="tg-dirty"' : '') + '>' +
      '<td class="unit-code">' + esc(r.code) + '</td>' +
      '<td class="unit-name">' + esc(r.name) + ((r.source === 'exam' || r.source === 'pending') && r.examTitle ? '<div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">from exam: ' + esc(r.examTitle) + '</div>' : '') + '</td>' +
      '<td><input class="tg-grade-input" id="tgg-' + i + '" data-stored="' + escAttr(storedG) + '" value="' + escAttr(dirty ? dirty.g : storedG) + '" placeholder="' + (r.source === 'pending' ? 'marking' : '—') + '" oninput="markDirtyRow(this)" title="A percentage, or C / Competent / NYC"></td>' +
      '<td><input class="tg-grade-input tg-date-input" id="tgd-' + i + '" data-stored="' + escAttr(storedD) + '" value="' + escAttr(dirty ? dirty.d : storedD) + '" placeholder="DD/MM/YYYY" oninput="markDirtyRow(this)"></td>' +
      '<td><span class="tg-src ' + r.source + '">' + srcLabel + '</span></td>' +
      '<td style="white-space:nowrap;">' +
        '<button class="tg-btn sm blue" title="Save this grade" onclick="saveUnitGrade(' + i + ')">Save</button> ' +
        (r.source === 'manual' ? '<button class="tg-btn sm danger" title="Remove manual override (falls back to live exam result)" onclick="clearUnitGrade(' + i + ')">✕</button>' : '') +
      '</td>' +
    '</tr>';
  }).join('');

  /* Grades recorded for units that are not in this plan any more (a code was
     edited, or the unit dropped from a revised plan). They are kept, and
     shown — a recorded grade is never silently hidden. */
  var orphans = T.orphanedGrades(q, db.grades, s.id);
  if (orphEl && orphans.length) {
    orphEl.innerHTML = '<div class="tg-note" style="margin-top:12px;"><b>Recorded grades for units no longer in this plan</b> — kept on record; re-code the unit in the catalogue to bring them back onto the transcript.' +
      '<table class="tg-table" style="margin-top:6px;"><tbody>' + orphans.map(function (g) {
        return '<tr><td class="unit-code">' + esc(g.unitCode) + '</td><td>' + esc(T.displayGrade({ grade: g.grade })) + '</td><td>' + esc(g.date || '') + '</td><td style="color:var(--text-muted);">' + esc(g.updatedBy || '') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }
  /* The same person on another programme (Level 2 then Level 3, or two
     programmes) is another enrolment record with its own transcript. */
  var others = T.otherEnrolments(s, db.students, db.profiles, false);
  if (otherEl && others.length) {
    otherEl.innerHTML = '<div class="tg-note" style="margin-top:12px;"><b>Other enrolments of this trainee</b>: ' + others.map(function (o) {
      return '<a href="#" onclick="event.preventDefault();onPickStudent(' + jsArg(o.student.id) + ')">' + esc(o.student.course || o.student.id) + '</a>' +
        (o.sameNameOnly ? ' <span style="color:var(--text-muted);">(same name only — check it is the same person)</span>' : '');
    }).join(' · ') + '</div>';
  }
}

// Every row typed in and not yet saved, saved in one go.
function saveAllChangedGrades() {
  captureDirtyGrades();
  var q = qualForStudent(sel.studentId, sel.qualId);
  if (!q) return;
  var codes = Object.keys(dirtyGrades);
  if (!codes.length) { toast('No changed rows to save', 'warn'); return; }
  var saved = 0;
  codes.forEach(function (code) {
    var i = -1;
    q.units.forEach(function (u, k) { if (u.code === code) i = k; });
    if (i !== -1 && saveUnitGrade(i, { quiet: true })) saved++;
  });
  toast(saved + ' of ' + codes.length + ' changed row(s) saved', saved === codes.length ? '' : 'warn');
}

function saveUnitGrade(i, opts) {
  opts = opts || {};
  captureDirtyGrades();
  var s = studentById(sel.studentId), q = qualForStudent(sel.studentId, sel.qualId);
  if (!s || !q) return false;
  var unit = q.units[i];
  if (!unit || !String(unit.code || '').trim()) {
    // A unit with no code cannot hold a grade (grades are filed by code): say
    // so, instead of "Grade saved" over nothing being stored.
    toast('This unit has no unit code — give it one in “Edit Unit Catalogue” before grading it', 'err');
    return false;
  }
  var gv = document.getElementById('tgg-' + i).value.trim();
  var dv = document.getElementById('tgd-' + i).value.trim();
  if (gv === '') { if (!opts.quiet) toast('Enter a grade first (or use ✕ to clear an override)', 'warn'); return false; }
  // A percentage, or a competency result (C / Competent / NYC). Anything else
  // is refused: it could be neither averaged nor judged competent.
  var gradeVal;
  if (T.isNumericGrade(gv)) {
    var num = Number(String(gv).replace('%', '').trim());
    if (num < 0 || num > 100) { toast('Grade must be between 0 and 100', 'warn'); return false; }
    gradeVal = num;
  } else if (T.competencyOf(gv)) {
    gradeVal = T.competencyOf(gv) === 'competent' ? 'Competent' : 'NYC';
  } else {
    toast('“' + gv + '” is not a grade — enter a percentage, or C / Competent / NYC', 'warn');
    return false;
  }

  var currentRows = rowsFor(s.id, q);
  var current = currentRows[i];
  var examResultId = current && current.examResultId;

  // Re-read before writing, so a grade another tab or device saved meanwhile
  // is not overwritten by this page's older copy of the list.
  db.grades = readJSON(T.KEYS.grades, []) || [];
  var before = JSON.stringify(db.grades);
  db.grades = T.upsertManualGrade(db.grades, {
    studentId: s.id, qualId: q.id, unitCode: unit.code,
    grade: gradeVal, date: dv || T.formatDateDMY(new Date().toISOString()),
    examResultId: examResultId, updatedBy: ACTOR
  });
  if (JSON.stringify(db.grades) === before) { toast('The grade could not be saved', 'err'); return false; }
  writeJSON(T.KEYS.grades, db.grades);
  delete dirtyGrades[unit.code];
  var num = typeof gradeVal === 'number' ? gradeVal : NaN;

  /* Manual override write-back into the live VocTrain exam result. */
  if (sel.alsoUpdateExam && examResultId && !isNaN(num)) {
    /* Patched into the results as they are stored NOW, one record only.
       This page wrote its whole cached list back, so a result submitted on
       the dashboard after the page loaded was erased; the original score was
       overwritten with no trace; and with no edit stamp the override never
       reached another device. */
    var fresh = freshList('voctrain_examResults', db.examResults);
    var res = fresh.filter(function (r) { return r && r.id === examResultId; })[0];
    if (res) {
      var exam = db.exams.filter(function (e) { return e && e.id === res.examId; })[0];
      var now = new Date().toISOString();
      if (res.originalScore === undefined) res.originalScore = res.score;
      if (!Array.isArray(res.overrideHistory)) res.overrideHistory = [];
      res.overrideHistory.push({ from: res.score, to: Math.round(num * 10) / 10, by: ACTOR, at: now });
      res.score = Math.round(num * 10) / 10;
      // A pass mark of 0 is a pass mark: `|| 60` used to replace it.
      res.passed = num >= ((exam && exam.passMark != null && exam.passMark !== '' && !isNaN(Number(exam.passMark))) ? Number(exam.passMark) : T.DEFAULT_PASS_MARK);
      res.manualOverride = true;
      res.overriddenBy = ACTOR;
      res.overriddenAt = now;
      res.updatedAt = (window.CESTISCore && CESTISCore.sync) ? CESTISCore.sync.laterStamp(now, res.updatedAt) : now;
      db.examResults = fresh;
      if (window.CESTISCore && CESTISCore.pageCloud) CESTISCore.pageCloud.guardedSet(CESTISStore, 'voctrain_examResults', fresh);
      else writeJSON('voctrain_examResults', fresh);
    }
  }
  notifyHost();
  db.index = T.gradeIndex(db.exams, db.examResults, db.catalogs);
  renderGradeRows();
  refreshPreview();
  if (!opts.quiet) toast('Grade saved — ' + unit.code + ' → ' + T.displayGrade({ grade: gradeVal }));
  return true;
}

function clearUnitGrade(i) {
  captureDirtyGrades();
  var s = studentById(sel.studentId), q = qualForStudent(sel.studentId, sel.qualId);
  if (!s || !q) return;
  var unit = q.units[i];
  // Written down as removed (not erased), so no other copy can put the old
  // grade back — see CESTISCore.Transcript.removeManualGrade.
  db.grades = T.removeManualGrade(freshList(T.KEYS.grades, db.grades), s.id, q.id, unit.code, ACTOR);
  writeJSON(T.KEYS.grades, db.grades);
  notifyHost();
  renderGradeRows();
  refreshPreview();
  toast('Manual override removed — live exam grade (if any) now applies');
}

function refreshPreview() {
  var host = document.getElementById('tgPreview');
  if (!host) return;
  host.innerHTML = renderTranscriptPreviewHTML(studentById(sel.studentId), qualForStudent(sel.studentId, sel.qualId));
}

function applyPreviewZoom(v) {
  var el = document.getElementById('tgPreviewScale');
  if (el) el.style.transform = 'scale(' + (v / 100) + ')';
  var host = el && el.parentElement;
  if (host) { el.style.width = (100 * 100 / v) + '%'; }
}

/* Issuing the official transcript takes a copy of the plan it was printed
   from onto the trainee's transcript profile (T.recordIssue), once. Every
   reprint uses that copy, so a later catalogue edit — a re-coded or dropped
   unit, a re-titled qualification — never rewrites a transcript already in a
   graduate's hands. */
function recordTranscriptIssue(s, q) {
  if (!s || !q || q.issuedSnapshot || !q.units || !q.units.length) return;
  db.profiles = readJSON(T.KEYS.profiles, {}) || {};
  var next = T.recordIssue(db.profiles, s.id, q);
  if (JSON.stringify(next) === JSON.stringify(db.profiles)) return;
  db.profiles = next;
  writeJSON(T.KEYS.profiles, db.profiles);
  notifyHost();
}
function reissueWithCurrentCatalogue() {
  var s = studentById(sel.studentId), live = qualById(sel.qualId);
  if (!s || !live) return;
  if (!confirm('Print ' + s.name + '\'s transcript from the CURRENT unit catalogue from now on?\n\nThe copy taken when it was first issued is replaced by today\'s.')) return;
  db.profiles = readJSON(T.KEYS.profiles, {}) || {};
  var p = Object.assign({}, db.profiles[s.id] || {});
  var issued = Object.assign({}, p.issued || {});
  issued[live.id] = T.snapshotQual(live);
  p.issued = issued; p.updatedAt = new Date().toISOString();
  db.profiles[s.id] = p;
  writeJSON(T.KEYS.profiles, db.profiles);
  notifyHost();
  renderGradeRows(); refreshPreview();
  toast('The transcript now follows the current catalogue');
}
function downloadTranscript() {
  var s = studentById(sel.studentId), q = qualForStudent(sel.studentId, sel.qualId);
  if (!s || !q) { toast('Select a trainee and qualification first', 'warn'); return; }
  recordTranscriptIssue(s, q);
  generateTranscriptPDF(s, qualForStudent(sel.studentId, sel.qualId) || q);
  renderGradeRows();
}
function downloadGradeSheet() {
  var s = studentById(sel.studentId), q = qualForStudent(sel.studentId, sel.qualId);
  if (!s || !q) { toast('Select a trainee and qualification first', 'warn'); return; }
  generateGradeSheetPDF(s, q);
}

/* ---- unit catalogue editor (input section for each skill area) ---- */
/* The editor works on a DRAFT of the catalogue. It used to edit the live
   qualification in place, so closing it unsaved still changed what the page
   showed, and a refused save would have left it half-edited. Each draft row
   remembers the code it had when the editor opened (_was), which is how a
   re-coded unit is told from a removed one. */
var catDraft = null;
function openCatalogEditor() {
  var q = qualById(sel.qualId);
  if (!q) { toast('Select a qualification first', 'warn'); return; }
  catDraft = JSON.parse(JSON.stringify(q));
  catDraft.units.forEach(function (u) { u._was = u.code; });
  renderCatalogEditor(q.id);
}

function renderCatalogEditor(qualId) {
  var q = (catDraft && catDraft.id === qualId) ? catDraft : null;
  var host = document.getElementById('tgCatalogModal');
  if (!q || !host) return;
  host.innerHTML =
  '<div style="position:fixed;inset:0;background:rgba(4,8,12,0.82);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;" onclick="if(event.target===this)closeCatalogEditor()">' +
    '<div style="background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:var(--radius);width:100%;max-width:860px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;">' +
      '<div class="tg-card-head"><div><h2>Unit Catalogue — ' + esc(q.title) + '</h2>' +
        '<div class="sub">These units define the transcript for every trainee in ' + esc(q.skillArea || 'this programme') + '.</div></div>' +
        '<button class="tg-btn sm" onclick="closeCatalogEditor()">✕ Close</button></div>' +
      '<div style="padding:14px 16px;overflow:auto;">' +
        '<div class="tg-field-grid" style="margin-bottom:12px;">' +
          '<div class="tg-field"><label>Qualification title (printed on transcript)</label><input class="tg-input" id="tgcTitle" value="' + escAttr(q.title) + '"></div>' +
          '<div class="tg-field"><label>Skill area</label><input class="tg-input" id="tgcSkill" value="' + escAttr(q.skillArea || '') + '"></div>' +
          '<div class="tg-field"><label>Training centre</label><input class="tg-input" id="tgcCentre" value="' + escAttr(q.centre || '') + '"></div>' +
        '</div>' +
        '<table class="tg-table"><thead><tr><th style="width:140px;">Unit code</th><th>Unit name</th><th style="width:120px;">Core/Elective</th><th style="width:52px;"></th></tr></thead><tbody id="tgcRows">' +
        q.units.map(function (u, i) {
          return '<tr>' +
            '<td><input class="tg-input" style="width:100%;" id="tgcC-' + i + '" value="' + escAttr(u.code) + '"></td>' +
            '<td><input class="tg-input" style="width:100%;" id="tgcN-' + i + '" value="' + escAttr(u.name) + '"></td>' +
            '<td><select class="tg-select" style="min-width:100px;width:100%;" id="tgcE-' + i + '">' +
              '<option' + (u.coreElective !== 'Elective' ? ' selected' : '') + '>Core</option>' +
              '<option' + (u.coreElective === 'Elective' ? ' selected' : '') + '>Elective</option></select></td>' +
            '<td><button class="tg-btn sm danger" onclick="removeCatalogUnit(' + jsArg(q.id) + ',' + i + ')">✕</button></td>' +
          '</tr>';
        }).join('') +
        '</tbody></table>' +
        '<div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap;">' +
          '<button class="tg-btn" onclick="addCatalogUnit(' + jsArg(q.id) + ')">＋ Add Unit</button>' +
          '<button class="tg-btn green" onclick="saveCatalog(' + jsArg(q.id) + ')">💾 Save Catalogue</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}
function closeCatalogEditor() { catDraft = null; document.getElementById('tgCatalogModal').innerHTML = ''; }

function collectCatalogEdits(q) {
  var rows = document.getElementById('tgcRows');
  if (!rows || !q) return;
  var units = [];
  for (var i = 0; ; i++) {
    var c = document.getElementById('tgcC-' + i);
    if (!c) break;
    var code = c.value.trim(), name = document.getElementById('tgcN-' + i).value.trim();
    if (!code && !name) continue;
    var u = { code: code, name: name, coreElective: document.getElementById('tgcE-' + i).value };
    var prev = q.units[i];
    if (prev && prev._was) u._was = prev._was;
    if (prev && prev.passMark != null) u.passMark = prev.passMark;
    units.push(u);
  }
  q.units = units;
  q.title = document.getElementById('tgcTitle').value.trim() || q.title;
  q.skillArea = document.getElementById('tgcSkill').value.trim();
  q.centre = document.getElementById('tgcCentre').value.trim();
}
function addCatalogUnit(qualId) {
  if (!catDraft || catDraft.id !== qualId) return;
  collectCatalogEdits(catDraft);
  catDraft.units.push({ code: '', name: '', coreElective: 'Core' });
  renderCatalogEditor(qualId);
}
function removeCatalogUnit(qualId, i) {
  if (!catDraft || catDraft.id !== qualId) return;
  collectCatalogEdits(catDraft);
  catDraft.units.splice(i, 1);
  renderCatalogEditor(qualId);
}
function saveCatalog(qualId) {
  var live = qualById(qualId);
  if (!live || !catDraft || catDraft.id !== qualId) return;
  collectCatalogEdits(catDraft);
  // Every unit needs a code, and codes are unique within a plan: grades are
  // filed under the code, so a blank one could hold none ("Grade saved" over
  // nothing stored) and two units sharing one shared one grade.
  var problems = T.validateCatalogUnits(catDraft.units);
  if (problems.length) {
    var p0 = problems[0];
    toast(p0.problem === 'blank-code'
      ? 'Unit ' + (p0.index + 1) + ' (' + (catDraft.units[p0.index].name || 'unnamed') + ') has no unit code — every unit needs one'
      : 'Unit code ' + p0.code + ' is used twice — each unit needs its own code', 'err');
    renderCatalogEditor(qualId);
    return;
  }
  db.grades = readJSON(T.KEYS.grades, []) || [];
  var graded = function (code) {
    return db.grades.some(function (g) { return g && g.qualId === qualId && g.unitCode === code && !g.supersededBy && g.grade != null && g.grade !== ''; });
  };
  // A unit whose CODE changed: offer to carry its recorded grades across
  // (nothing is moved without asking; the old records stay, marked).
  var recoded = catDraft.units.filter(function (u) { return u._was && u._was !== u.code && graded(u._was); });
  var gradesChanged = false;
  recoded.forEach(function (u) {
    var n = db.grades.filter(function (g) { return g && g.qualId === qualId && g.unitCode === u._was && !g.supersededBy; }).length;
    if (confirm('Unit ' + u._was + ' is now ' + u.code + '.\n\n' + n + ' recorded grade(s) are filed under ' + u._was +
                '. Carry them across to ' + u.code + '?\n\n(OK = carry them across; Cancel = leave them under the old code, listed as "no longer in this plan".)')) {
      var r = T.renameUnitCode(db.grades, qualId, u._was, u.code, ACTOR);
      db.grades = r.list; gradesChanged = true;
    }
  });
  // A unit removed from the plan: its grades are kept and listed, never deleted.
  var kept = {};
  catDraft.units.forEach(function (u) { if (u._was) kept[u._was] = true; });
  var removedGraded = live.units.filter(function (u) { return !kept[u.code] && graded(u.code); }).map(function (u) { return u.code; });
  if (removedGraded.length && !confirm('Units ' + removedGraded.join(', ') + ' have recorded grades and are being removed from this plan.\n\n' +
      'Their grades are kept and listed as "no longer in this plan"; transcripts already issued keep printing them. Save the catalogue?')) return;
  if (gradesChanged) writeJSON(T.KEYS.grades, db.grades);
  live.units = catDraft.units.map(function (u) { var c = Object.assign({}, u); delete c._was; return c; });
  live.title = catDraft.title; live.skillArea = catDraft.skillArea; live.centre = catDraft.centre;
  live.updatedAt = new Date().toISOString();
  // Re-read the stored catalogues and replace only this one, so another
  // qualification saved meanwhile elsewhere is not overwritten.
  var stored = T.ensureSeeded(readJSON(T.KEYS.catalogs, []));
  var at = -1;
  stored.forEach(function (q, k) { if (q && q.id === qualId) at = k; });
  if (at === -1) stored.push(live); else stored[at] = live;
  writeJSON(T.KEYS.catalogs, stored);
  db.catalogs = stored;
  db.index = T.gradeIndex(db.exams, db.examResults, db.catalogs);
  notifyHost();
  closeCatalogEditor();
  fillQualSelect();
  renderGradeRows();
  refreshPreview();
  toast('Unit catalogue saved — trainee grade pages update automatically (transcripts already issued keep their own copy)');
}

function renderAdmin() {
  if (!document.getElementById('tgStudentSel')) {

  }

/* ============================================================================
   STUDENT (TRAINEE) VIEW — live grades + transcript/certificate requests
   ============================================================================ */
function myStudentRecord() {
  // The session's own record only — never a name or id typed into the address.
  // (The name fallback, for a record whose id moved since sign-in, uses the
  // signed-in account's own name.)
  var s = MY_STUDENT_ID ? studentById(MY_STUDENT_ID) : null;
  if (s || !MY_NAME) return s;
  var n = T.normText(MY_NAME), c = T.normText(MY_COURSE);
  return db.students.filter(function (st) {
    return st && T.normText(st.name) === n && (!c || T.normText(st.course) === c);
  })[0] || null;
}

var myEnrolmentId = '';   // which of the trainee's own enrolments is on screen
var shownEnrolment = null;
function pickMyEnrolment(id) { myEnrolmentId = id; renderStudent(); }
function renderStudent() {
  var app = document.getElementById('tgApp');
  var me = myStudentRecord();
  if (!me) {
    app.innerHTML = '<div class="tg-empty"><div class="big">🎓</div>Your trainee record could not be found yet.<br>Please ask your administrator to enrol you, then reopen this page.</div>';
    return;
  }
  /* A trainee who went from Level 2 to Level 3 (or takes two programmes) has
     one record per enrolment and used to see only the one their login points
     at. Their other enrolments are offered here — only those that are provably
     the same person (same TRN / national ID or date of birth): a namesake on
     another programme is somebody else. */
  var mine = [me].concat(T.otherEnrolments(me, db.students, db.profiles, true).map(function (o) { return o.student; }));
  var s = mine.filter(function (x) { return x.id === myEnrolmentId; })[0] || me;
  shownEnrolment = s;
  var live = T.qualForTrainee(db.catalogs, s);
  var q = live ? qualForStudent(s.id, live.id) : null;
  var rows = q ? rowsFor(s.id, q) : [];
  var stats = T.gradeStats(rows, q);
  var canTranscript = !T.hasOpenRequest(db.requests, s.id, 'transcript');
  var canCert = !T.hasOpenRequest(db.requests, s.id, 'certificate');
  var myReqs = db.requests.filter(function (r) { return r && r.studentId === s.id; })
    .sort(function (a, b) { return String(b.requestedAt).localeCompare(String(a.requestedAt)); });

  app.innerHTML =
  '<div class="tg-header">' +
    '<div><h1>Transcript / Grades</h1>' +
    '<p><span class="tg-live-dot"></span>Live view — your grades appear here the moment an exam is marked on VocTrain or Admin updates your record.</p></div>' +
    '<div style="display:flex;gap:9px;flex-wrap:wrap;">' +
      '<button class="tg-btn primary" ' + (canTranscript ? '' : 'disabled') + ' onclick="requestDoc(\'transcript\')">📜 Request Transcript</button>' +
      '<button class="tg-btn green" ' + (canCert ? '' : 'disabled') + ' onclick="requestDoc(\'certificate\')">🎖 Request Certificate</button>' +
    '</div>' +
  '</div>' +
  (mine.length > 1 ? '<div class="tg-controls"><select class="tg-select" onchange="pickMyEnrolment(this.value)">' + mine.map(function (x) {
      return '<option value="' + escAttr(x.id) + '"' + (x.id === s.id ? ' selected' : '') + '>' + esc(x.course || x.id) + '</option>';
    }).join('') + '</select></div>' : '') +
  '<div class="tg-stats">' +
    '<div class="tg-stat"><div class="v">' + esc(s.course || '—') + '</div><div class="l">Programme</div></div>' +
    '<div class="tg-stat"><div class="v">' + stats.competent + '/' + stats.total + '</div><div class="l">Units competent</div></div>' +
    '<div class="tg-stat"><div class="v">' + (stats.average == null ? '—' : T.formatGrade(stats.average)) + '</div><div class="l">Average of % grades</div></div>' +
    '<div class="tg-stat"><div class="v">' + (stats.total ? Math.round(stats.graded / stats.total * 100) : 0) + '%</div><div class="l">Units graded</div></div>' +
  '</div>' +
  (myReqs.length ?
    '<div class="tg-card" style="margin-bottom:16px;"><div class="tg-card-head"><h2>My Requests</h2></div><div class="tg-card-body" style="padding-top:6px;">' +
    '<table class="tg-table"><thead><tr><th>Type</th><th>Requested</th><th>Status</th></tr></thead><tbody>' +
    myReqs.map(function (r) {
      var color = r.status === 'ready' ? 'exam' : (r.status === 'declined' ? 'none' : 'manual');
      return '<tr><td>' + esc(T.REQUEST_TYPES[r.type] || r.type) + '</td><td>' + esc(T.formatDateDMY(r.requestedAt)) + '</td>' +
        '<td><span class="tg-src ' + color + '">' + esc(T.REQUEST_STATUS_LABELS[r.status] || r.status) + '</span>' +
        (r.adminNote ? '<div style="font-size:10.5px;color:var(--text-muted);margin-top:2px;">' + esc(r.adminNote) + '</div>' : '') + '</td></tr>';
    }).join('') + '</tbody></table></div></div>' : '') +
  '<div class="tg-card"><div class="tg-card-head"><div><h2>' + esc(q ? q.title : 'My Units') + '</h2>' +
    '<div class="sub">' + (q ? q.units.length + ' units on your qualification plan' : 'No unit catalogue has been set up for your programme yet — your administrator can add it on the Transcript/Grades page.') + '</div></div></div>' +
    '<div class="tg-card-body" style="padding-top:6px;">' +
    '<table class="tg-table"><thead><tr><th style="width:120px;">Unit code</th><th>Unit name</th><th style="width:110px;">Date</th><th style="width:90px;">Final grade</th></tr></thead><tbody>' +
    (rows.length ? rows.map(function (r) {
      var graded = r.grade != null && r.grade !== '';
      return '<tr><td class="unit-code">' + esc(r.code) + '</td><td class="unit-name">' + esc(r.name) + '</td>' +
        '<td>' + esc(r.date || '—') + '</td>' +
        '<td style="font-weight:700;color:' + (graded ? 'var(--green)' : 'var(--text-muted)') + ';">' + esc(graded || r.source === 'pending' ? T.displayGrade(r) : 'Pending') + '</td></tr>';
    }).join('') : '<tr><td colspan="4" style="text-align:center;color:var(--text-muted);padding:24px;">No units to show yet.</td></tr>') +
    '</tbody></table></div></div>';
}

/* A request is ADDED to the queue as it stands in the store right now
   (T.mergeRequestLists), never written as this page's copy of the whole list,
   and then sent to the Centre's request file (CESTISPageCloud.saveShared),
   where it is merged request by request with the administration's own. It
   used to stay in this browser for good: nothing carried it off a trainee's
   device, while the page said the administration had been told. */
function requestDoc(type) {
  // The enrolment on screen (the trainee's own record, or another enrolment
  // of the same person they picked above).
  var s = shownEnrolment || myStudentRecord();
  if (!s) return;
  db.requests = readJSON(T.KEYS.requests, []) || [];
  if (T.hasOpenRequest(db.requests, s.id, type)) { toast('You already have an open ' + type + ' request', 'warn'); renderStudent(); return; }
  db.requests = T.mergeRequestLists(db.requests, [T.newRequest({ studentId: s.id, studentName: s.name, course: s.course, type: type })]);
  writeJSON(T.KEYS.requests, db.requests);
  notifyHost({ requests: true });
  renderStudent();
  var sent = null;
  try { if (window.CESTISPageCloud && CESTISPageCloud.saveShared) sent = CESTISPageCloud.saveShared([T.KEYS.requests]); } catch (e) { sent = null; }
  if (!sent) { toast('Request saved on this device — it will be sent to the administration when this device is connected', 'warn'); return; }
  sent.then(function (wrote) {
    toast(wrote && wrote.length ? 'Request sent — the administration team has been notified'
      : 'Request saved on this device — it will be sent to the administration when this device is connected', wrote && wrote.length ? '' : 'warn');
  }, function () { toast('Request saved on this device — it will be sent when this device is connected', 'warn'); });
}

/* ============================================================================
   INSTRUCTOR VIEW — live grades for the instructor's own trainees
   ============================================================================ */
var insOpen = {};
/* The instructor's trainees: those on any programme the instructor teaches —
   compared the way the rest of the platform compares programmes
   (CESTISCore.enrolment.programmesAgree: the same programme written two ways,
   never two levels), not by one name being a substring of the other — plus
   anyone whose record names this instructor. */
function sameProgramme(a, b) {
  if (!a || !b) return false;
  try { if (CESTISCore.enrolment && CESTISCore.enrolment.programmesAgree) return !!CESTISCore.enrolment.programmesAgree(a, b); } catch (e) {}
  return T.normText(a) === T.normText(b);
}
function instructorStudents() {
  if (!MY_COURSES.length && !MY_NAME) return [];
  return db.students.filter(function (s) {
    if (!s) return false;
    var byCourse = !!s.course && MY_COURSES.some(function (c) { return sameProgramme(s.course, c); });
    var byName = MY_NAME && s.instructor && T.normText(s.instructor) === T.normText(MY_NAME);
    return byCourse || byName;
  });
}
// Each trainee is graded against THEIR OWN programme's plan (a Level 3
// trainee was shown — and given grade sheets for — the instructor's Level 2
// units); the instructor's course is only the fallback.
function insQualFor(s) {
  var live = T.qualForTrainee(db.catalogs, s, MY_COURSE);
  return live ? qualForStudent(s.id, live.id) : null;
}

function renderInstructor() {
  var app = document.getElementById('tgApp');
  var list = instructorStudents();
  app.innerHTML =
  '<div class="tg-header">' +
    '<div><h1>Trainee Grades</h1>' +
    '<p><span class="tg-live-dot"></span>Live grades for your trainees' + (MY_COURSES.length ? ' in <b>' + esc(MY_COURSES.join(', ')) + '</b>' : '') + ' — exam results and Admin updates appear instantly. Grade sheets carry your name as instructor.</p></div>' +
  '</div>' +
  (!list.length ? '<div class="tg-empty"><div class="big">🧑‍🏫</div>No trainees found for your course yet.</div>' :
    list.map(function (s, i) {
      var q = insQualFor(s);
      var rows = q ? rowsFor(s.id, q) : [];
      var stats = T.gradeStats(rows, q);
      var open = !!insOpen[s.id];
      return '<div class="tg-card" style="margin-bottom:12px;">' +
        '<div class="tg-card-head" style="cursor:pointer;" onclick="toggleInsRow(' + jsArg(s.id) + ')">' +
          '<div><h2>' + esc(s.name) + '</h2><div class="sub">' + esc(s.course || '') + (q ? ' • ' + esc(q.title) : '') + ' • ' + stats.competent + '/' + stats.total + ' units competent • avg of % grades ' + (stats.average == null ? '—' : T.formatGrade(stats.average)) + '</div></div>' +
          '<div style="display:flex;gap:8px;align-items:center;">' +
            '<button class="tg-btn sm green" onclick="event.stopPropagation();insGradeSheet(' + jsArg(s.id) + ')">⬇ Grade Sheet</button>' +
            '<span style="color:var(--text-muted);font-size:12px;">' + (open ? '▲' : '▼') + '</span></div>' +
        '</div>' +
        (open ? '<div class="tg-card-body" style="padding-top:6px;">' +
          '<table class="tg-table"><thead><tr><th style="width:120px;">Unit code</th><th>Unit name</th><th style="width:110px;">Date</th><th style="width:90px;">Grade</th><th style="width:90px;">Source</th></tr></thead><tbody>' +
          (rows.length ? rows.map(function (r) {
            var graded = r.grade != null && r.grade !== '';
            return '<tr><td class="unit-code">' + esc(r.code) + '</td><td class="unit-name">' + esc(r.name) + '</td><td>' + esc(r.date || '—') + '</td>' +
              '<td style="font-weight:700;color:' + (graded ? 'var(--green)' : 'var(--text-muted)') + ';">' + esc(graded || r.source === 'pending' ? T.displayGrade(r) : 'Pending') + '</td>' +
              '<td><span class="tg-src ' + r.source + '">' + (r.source === 'exam' ? 'Live exam' : r.source === 'manual' ? 'Manual' : r.source === 'pending' ? 'Awaiting marking' : '—') + '</span></td></tr>';
          }).join('') : '<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:18px;">No unit catalogue for this programme yet.</td></tr>') +
          '</tbody></table></div>' : '') +
      '</div>';
    }).join(''));
}
function toggleInsRow(id) { insOpen[id] = !insOpen[id]; renderInstructor(); }
function insGradeSheet(id) {
  var s = studentById(id);
  var q = s ? insQualFor(s) : null;
  if (!s || !q) { toast('No unit catalogue set up for this programme yet', 'warn'); return; }
  generateGradeSheetPDF(s, q);
}

/* ============================================================================
   BOOT + LIVE UPDATES
   ============================================================================ */
function renderForRole() {
  if (!VIEWER.ok) {
    document.getElementById('tgApp').innerHTML = '<div class="tg-empty">' + esc(VIEWER.message || 'Please sign in to the C.E.S.T.I.S dashboard first.') + '</div>';
    return;
  }
  if (IS_STAFF) renderAdmin();
  else if (ROLE === 'instructor') renderInstructor();
  else renderStudent();
}

var LIVE_KEYS = ['voctrain_examResults', 'voctrain_exams', 'voctrain_students', 'voctrain_instructorData'];
function isLiveKey(k) {
  return LIVE_KEYS.indexOf(k) !== -1 ||
    k === T.KEYS.grades || k === T.KEYS.catalogs || k === T.KEYS.requests || k === T.KEYS.profiles;
}

/* Other tabs / the host LMS / cloud sync write to the same store — the
   localStorage mirror fires `storage` here, and we re-render from source. */
window.addEventListener('storage', function (e) {
  if (e.key && isLiveKey(e.key)) { loadAll(); renderForRole(); }
});
window.addEventListener('message', function (e) {
  if (e.data && (e.data.type === 'transcript-refresh' || e.data.type === 'refresh-students')) {
    loadAll(); renderForRole();
  }
  // "Open transcript" on a certificate/transcript request (OF-9): this trainee
  // chosen — the office's view only, from the dashboard only.
  if (e.data && e.data.type === 'cestis-tg-select' && e.source === window.parent) tgSelectFromOffice(String(e.data.studentId || ''));
});
/* Open the office's transcript editor on one trainee (a request's "Open
   transcript"): instead of finding her among every trainee in the picker. */
function tgSelectFromOffice(id) {
  if (!IS_STAFF || !VIEWER.ok || !id) return false;
  if (!db || !db.students || !studentById(id)) return false;
  if (sel.studentId !== id) onPickStudent(id);
  return true;
}
/* Safety net for writes that only land in IndexedDB (no storage event). */
var lastFingerprint = '';
setInterval(function () {
  var fp = '';
  try {
    fp = String(CESTISStore.getItem('voctrain_examResults') || '').length + '|' +
         String(CESTISStore.getItem(T.KEYS.grades) || '').length + '|' +
         String(CESTISStore.getItem(T.KEYS.catalogs) || '').length + '|' +
         String(CESTISStore.getItem(T.KEYS.requests) || '').length + '|' +
         String(CESTISStore.getItem('voctrain_students') || '').length;
  } catch (e) {}
  if (fp !== lastFingerprint && VIEWER.ok) {
    lastFingerprint = fp;
    loadAll();
    renderForRole();
  }
}, 5000);

function boot() {
  if (!window.CESTISCore || !CESTISCore.Transcript || !window.CESTISStore) {
    document.getElementById('tgApp').innerHTML = '<div class="tg-empty">Shared data core failed to load. Please refresh.</div>';
    return;
  }
  if (!VIEWER.ok) { renderForRole(); return; }   // nothing is read, rendered or written without a session
  loadAll();
  renderForRole();
  // Opened for one trainee (a request's "Open transcript", OF-9).
  var pick = param('select');
  if (pick) tgSelectFromOffice(pick);
}

document.addEventListener('DOMContentLoaded', function () {
  if (window.CESTISStore && typeof CESTISStore.whenReady === 'function') {
    CESTISStore.whenReady(boot);
  } else { boot(); }
});

<!-- Per-page Google Drive save path (own file in the shared backup folder) -->
<script src="cestis-page-cloud.js?v=20261028e"></script>
<script>
// Staff own this page's file: they pull it and push their edits. Anybody else
// — a trainee, an instructor — only READS the grades and catalogues they are
// shown, and never the other trainees' transcript profiles; a page opened with
// no signed-in session moves nothing at all. (A trainee's device keeps only
// its own transcript data after logout, so a push from it would carry a cut-
// down list over the Centre's file.)
var TG_READS = ['voctrain_students', 'voctrain_skillAreas', 'voctrain_deletedCentreIds', 'voctrain_examResults'];
var _tgStaff = (typeof IS_STAFF !== 'undefined' && IS_STAFF);
var _tgSignedIn = (typeof VIEWER !== 'undefined' && VIEWER.ok);
var _tgTrainee = _tgSignedIn && (typeof ROLE !== 'undefined' && ROLE === 'student');
CESTISPageCloud.init(_tgStaff ? {
  page: 'Transcript / Grades',
  file: 'CESTIS_Transcript_Grades.json',
  keys: ['voctrain_transcriptGrades', 'voctrain_unitCatalogs', 'voctrain_transcriptProfiles'],
  // Grades are recorded against the trainee roll and the training centres, both
  // owned elsewhere: pulled from Drive here, never written back.
  reads: TG_READS,
  onRestore: function () { try { loadAll(); renderForRole(); } catch (e) {} }
} : {
  page: 'Transcript / Grades (reader)',
  file: 'CESTIS_Transcript_Grades.reader',      // a reader publishes no file of its own
  readOnly: true,
  reads: _tgSignedIn ? TG_READS.concat(['voctrain_transcriptGrades', 'voctrain_unitCatalogs'])
    .concat(_tgTrainee ? ['voctrain_certTranscriptRequests'] : []) : [],
  // A trainee's request is a decision they may put into the request queue the
  // administration owns (CESTIS_Transcript_Requests.json); it is merged there
  // request by request, so it can neither replace nor be replaced by the
  // queue. Status changes come back the same way.
  writes: _tgTrainee ? ['voctrain_certTranscriptRequests'] : [],
  onRestore: function () { try { if (_tgSignedIn) { loadAll(); renderForRole(); } } catch (e) {} }
});
</script>
