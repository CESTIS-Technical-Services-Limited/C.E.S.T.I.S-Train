<!--
  ============================================================================
  Pages/AdminStaff-Attendance.html  —  C.E.S.T.I.S Attendance Management (Admin Staff) UI fragment
  ----------------------------------------------------------------------------
  Fetched by index.html and injected into the mount slot
  (<div class="cestis-mount" data-feature="as-attendance" data-prefix="adminstaff">).
  The data rows in #asAttBody are filled on mount by renderAsAttendance() (in index.html).
  All JS and CSS remain in index.html. Injected via innerHTML — <script> won't run.
  ============================================================================
-->
<!-- The week strip (previous / this / next week) is drawn into this slot. -->
<div id="asAttendanceQuarterBar"></div>
<div class="card-header" style="margin-bottom:16px;"><h3 style="font-family:'Playfair Display',serif;">Attendance Records</h3><span style="font-size:13px;color:var(--text-muted);" id="asAttCount"></span></div>
<div style="display:flex;gap:12px;margin-bottom:16px;align-items:center;flex-wrap:wrap;">
  <label style="font-size:13px;font-weight:600;" for="asAttendanceDate">Date:</label>
  <input type="date" class="form-control" style="width:180px;" id="asAttendanceDate" onchange="onAttendanceDateChange(this.value)">
  <select class="form-control" style="width:200px;" id="asAttendanceCourseFilter" onchange="renderAsAttendance()"><option value="all">All Courses</option></select>
  <input type="search" class="form-control" style="width:200px;" id="asAttendanceSearch" placeholder="Search name or ID" oninput="renderAsAttendance()">
</div>
<div class="table-wrapper"><table><thead id="asAttHead"><tr><th>Student ID</th><th>Name</th><th>Course</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr></thead><tbody id="asAttBody"></tbody></table></div>
