<!--
  ============================================================================
  Pages/CMC-Portal.html — CMC Board view-only portal UI fragment
  ----------------------------------------------------------------------------
  Fetched by index.html and injected into the mount slot
  (<div class="cestis-mount" data-feature="cmc-portal" data-prefix="cmc">).
  On mount index.html calls cmcPortalOnShow(), implemented in cmc-portal.js
  (injected fragments cannot run <script>).

  The Community Management Committee gets READ-ONLY oversight of:
    • Dashboard        — total students on the platform + headline counts
    • Student Progress  — enrolment/progress roster (no editing)
    • Announcements     — published notices
    • Calendar          — scheduled events
    • LMS Chat          — read the conversation, no posting
    • Video Conference  — scheduled sessions, no hosting/joining controls
    • Cashbook          — CESTIS.Cashbook.html in cmc view mode, which exposes
                          only its Main Dashboard and Transactions pages.
  Every panel here renders from the shared data core with no mutating controls.
  ============================================================================
-->
<style>
  .cmcp-banner {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-left: 4px solid var(--teal, #1abc9c); margin-bottom: 18px;
  }
  .cmcp-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .cmcp-tab {
    padding: 8px 16px; border-radius: 10px; cursor: pointer; font-size: 13px;
    background: var(--bg-card-hover, rgba(127,127,127,.12));
    border: 1px solid var(--border, #444); white-space: nowrap;
  }
  .cmcp-tab:hover { border-color: var(--teal, #1abc9c); }
  .cmcp-tab.active {
    background: var(--teal, #1abc9c); color: #10231f; font-weight: 700;
    border-color: var(--teal, #1abc9c);
  }
  .cmcp-readonly-pill {
    font-size: 11px; padding: 2px 10px; border-radius: 10px; white-space: nowrap;
    background: rgba(26,188,156,.15); color: var(--teal, #1abc9c); font-weight: 700;
  }
  .cmcp-chat-wrap { display: grid; grid-template-columns: 240px 1fr; gap: 14px; }
  @media (max-width: 820px) { .cmcp-chat-wrap { grid-template-columns: 1fr; } }
  .cmcp-room {
    padding: 9px 12px; border-radius: 8px; cursor: pointer; font-size: 13px;
    border: 1px solid transparent;
  }
  .cmcp-room:hover { background: var(--bg-card-hover, rgba(127,127,127,.12)); }
  .cmcp-room.active { background: var(--bg-card-hover, rgba(127,127,127,.16)); border-color: var(--teal, #1abc9c); }
  .cmcp-msg { padding: 8px 0; border-bottom: 1px solid var(--border, #333); font-size: 13px; }
  .cmcp-msg .who { font-weight: 700; font-size: 12px; }
  .cmcp-msg .when { font-size: 11px; color: var(--text-muted); margin-left: 6px; }
  .cmcp-frame {
    width: 100%; height: calc(100vh - var(--topbar-h, 64px) - 210px);
    min-height: 520px; border: none; border-radius: 12px; background: #fff;
  }
</style>

<div id="cmcPortalRoot">
  <div class="card" style="padding:32px;text-align:center;color:var(--text-muted);">Loading CMC portal…</div>
</div>
